<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Notepad</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper:#F6F2E7;
    --paper-card:#FFFDF8;
    --ink:#20293B;
    --ink-soft:#5B6274;
    --line:#DCD5C2;
    --cork:#8A5A34;
    --cork-dark:#6B4426;
    --pin:#C0392B;
    --sticky:#F4D35E;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(32,41,59,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
  }

  h1{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.5px;
    margin:0;
  }

  .tagline{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1px;
  }

  .composer{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
    box-shadow:0 1px 0 rgba(32,41,59,0.04), 0 4px 14px rgba(32,41,59,0.06);
    margin-bottom:36px;
  }

  .composer input[type=text]{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    font-family:'Space Mono',monospace;
    font-size:13px;
    padding:6px 2px 10px;
    margin-bottom:10px;
    color:var(--ink);
    outline:none;
  }
  .composer input[type=text]:focus{border-bottom-color:var(--cork);}
  .composer input[type=text]::placeholder{color:#A9A290;}

  .composer textarea{
    width:100%;
    min-height:90px;
    border:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.6;
    resize:vertical;
    outline:none;
    color:var(--ink);
  }
  .composer textarea::placeholder{color:#B4AD98;}

  .composer-footer{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    margin-top:6px;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }

  button.save{
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-family:'Space Mono',monospace;
    font-size:13px;
    font-weight:700;
    padding:9px 18px;
    border-radius:4px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  button.save:hover{background:var(--cork-dark);}
  button.save:disabled{opacity:0.4;cursor:default;}

  .status{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  .board-label{
    font-family:'Space Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-soft);
    margin:0 0 14px 2px;
  }

  .notes{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .note{
    position:relative;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px 16px 14px;
    box-shadow:0 1px 0 rgba(32,41,59,0.04), 0 3px 10px rgba(32,41,59,0.05);
  }

  .note::before{
    content:"";
    position:absolute;
    top:-6px;
    left:20px;
    width:11px;
    height:11px;
    background:var(--pin);
    border-radius:50%;
    box-shadow:0 2px 3px rgba(0,0,0,0.25);
  }

  .note-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }

  .note-author{
    font-family:'Space Mono',monospace;
    font-size:12px;
    font-weight:700;
    color:var(--cork-dark);
  }

  .note-time{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  .note-text{
    font-size:15px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
    margin:0 0 10px;
  }

  .note-actions{
    display:flex;
    justify-content:flex-end;
  }

  .del-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'Space Mono',monospace;
    font-size:11px;
    cursor:pointer;
    padding:4px 6px;
    text-decoration:underline;
  }
  .del-btn:hover{color:var(--pin);}

  .empty{
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:40px 0;
    border:1px dashed var(--line);
    border-radius:6px;
  }

  .err{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--pin);
    margin-bottom:14px;
  }

  @media (max-width:420px){
    h1{font-size:21px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Office Notepad</h1>
      <div class="tagline">Shared notes &mdash; sino man sa office, pwede magbasa't magsulat</div>
    </div>
  </header>

  <div id="errBox"></div>

  <div class="composer">
    <input type="text" id="authorInput" placeholder="Pangalan mo (optional)" maxlength="40">
    <textarea id="noteInput" placeholder="Isulat dito ang note mo..."></textarea>
    <div class="composer-footer">
      <span class="status" id="statusText"></span>
      <button class="save" id="saveBtn">I-save</button>
    </div>
  </div>

  <p class="board-label" id="boardLabel">Mga note</p>
  <div class="notes" id="notesList">
    <div class="empty">Naglo-load ng mga note...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyCRl2LQBqPUc7uCqJp6sSwPSF6o-9dKb9w",
    authDomain: "birthday-tracker-dff7f.firebaseapp.com",
    projectId: "birthday-tracker-dff7f",
    storageBucket: "birthday-tracker-dff7f.firebasestorage.app",
    messagingSenderId: "796866393410",
    appId: "1:796866393410:web:c548cf89c5df9cb9ef04db",
    measurementId: "G-7TPQ3R4JTP"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const notesCol = db.collection('office_notes');

  const notesList = document.getElementById('notesList');
  const noteInput = document.getElementById('noteInput');
  const authorInput = document.getElementById('authorInput');
  const saveBtn = document.getElementById('saveBtn');
  const statusText = document.getElementById('statusText');
  const errBox = document.getElementById('errBox');
  const boardLabel = document.getElementById('boardLabel');

  let notes = [];

  function showError(msg){
    errBox.innerHTML = '<div class="err">' + msg + '</div>';
  }
  function clearError(){ errBox.innerHTML = ''; }

  function fmtTime(ts){
    try{
      const d = new Date(ts);
      return d.toLocaleString('en-PH', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    }catch(e){ return ''; }
  }

  function render(){
    boardLabel.textContent = notes.length ? ('Mga note (' + notes.length + ')') : 'Mga note';
    if(!notes.length){
      notesList.innerHTML = '<div class="empty">Wala pang note. Ikaw na ang unang mag-post!</div>';
      return;
    }
    const sorted = [...notes].sort((a,b) => b.ts - a.ts);
    notesList.innerHTML = sorted.map(n => {
      const author = n.author && n.author.trim() ? escapeHtml(n.author.trim()) : 'Anonymous';
      return '<div class="note" data-id="' + n.id + '">' +
        '<div class="note-meta">' +
          '<span class="note-author">' + author + '</span>' +
          '<span class="note-time">' + fmtTime(n.ts) + '</span>' +
        '</div>' +
        '<p class="note-text">' + escapeHtml(n.text) + '</p>' +
        '<div class="note-actions"><button class="del-btn" data-id="' + n.id + '">alisin</button></div>' +
      '</div>';
    }).join('');

    notesList.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteNote(btn.getAttribute('data-id')));
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  notesCol.onSnapshot(function(snapshot){
    notes = snapshot.docs.map(function(doc){
      const d = doc.data();
      return { id: doc.id, author: d.author || '', text: d.text || '', ts: d.ts || 0 };
    });
    clearError();
    render();
  }, function(err){
    showError('Hindi ma-konekta sa Firebase. I-check ang internet o Firestore rules.');
  });

  async function saveNote(){
    const text = noteInput.value.trim();
    if(!text){
      noteInput.focus();
      return;
    }
    clearError();
    saveBtn.disabled = true;
    statusText.textContent = 'Sine-save...';

    try{
      await notesCol.add({
        author: authorInput.value.trim(),
        text: text,
        ts: Date.now()
      });
      noteInput.value = '';
      statusText.textContent = 'Na-save.';
    }catch(e){
      showError('Hindi na-save. I-check ang Firestore rules o internet connection.');
      statusText.textContent = '';
    }
    saveBtn.disabled = false;
    setTimeout(() => { statusText.textContent = ''; }, 2000);
  }

  async function deleteNote(id){
    try{
      await notesCol.doc(id).delete();
    }catch(e){
      showError('Hindi na-delete. Subukan ulit.');
    }
  }

  saveBtn.addEventListener('click', saveNote);
  noteInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      saveNote();
    }
  });
})();
</script>
</body>
</html>
