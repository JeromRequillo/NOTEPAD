<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Notepad — Wheels Inc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0D0D12;
  --s0:#17171F;
  --s1:#1F1F2B;
  --s2:#2A2A3A;
  --s3:#35354A;
  --bd:rgba(255,255,255,0.07);
  --bdfocus:rgba(139,92,246,0.55);
  --ink:#EEEEF4;
  --ink2:#9090A8;
  --ink3:#52526A;
  --A:#8B5CF6;
  --B:#06B6D4;
  --C:#F59E0B;
  --rose:#F43F5E;
  --green:#10B981;
  --dur:220ms;
  --ease:cubic-bezier(.22,1,.36,1);
  --r:14px;
  --rsm:10px;
  --rxs:7px;
  --glow:0 0 28px rgba(139,92,246,0.2);
  --sh:0 2px 12px rgba(0,0,0,0.5);
  --shmd:0 8px 28px rgba(0,0,0,0.6);
  --shlg:0 20px 50px rgba(0,0,0,0.75);
}
[data-theme="light"]{
  --bg:#F1F0F9;
  --s0:#FFFFFF;
  --s1:#F5F4FC;
  --s2:#ECEAF8;
  --s3:#E0DDF5;
  --bd:rgba(0,0,0,0.07);
  --bdfocus:rgba(139,92,246,0.45);
  --ink:#16162A;
  --ink2:#5A5A7A;
  --ink3:#9A9AB8;
  --glow:0 0 28px rgba(139,92,246,0.12);
  --sh:0 2px 12px rgba(0,0,0,0.06);
  --shmd:0 8px 28px rgba(0,0,0,0.08);
  --shlg:0 20px 50px rgba(0,0,0,0.1);
}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;transition:background var(--dur) ease,color var(--dur) ease;}

/* ── BG EFFECTS ── */
canvas#cvs{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.3;}
[data-theme="light"] canvas#cvs{opacity:0.1;}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.1;animation:orbf 14s ease-in-out infinite;}
[data-theme="light"] .orb{opacity:0.055;}
.o1{width:560px;height:560px;background:var(--A);top:-130px;left:-130px;}
.o2{width:480px;height:480px;background:var(--B);bottom:-100px;right:-100px;animation-delay:-5s;}
.o3{width:340px;height:340px;background:var(--C);top:38%;left:52%;animation-delay:-9s;}
@keyframes orbf{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(22px,-30px) scale(1.06);}66%{transform:translate(-16px,20px) scale(0.96);}}
.cglow{position:fixed;pointer-events:none;z-index:1;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,0.07) 0%,transparent 70%);transform:translate(-50%,-50%);transition:left 80ms linear,top 80ms linear;mix-blend-mode:screen;}
[data-theme="light"] .cglow{background:radial-gradient(circle,rgba(139,92,246,0.05) 0%,transparent 70%);}
.spbar{position:fixed;top:0;left:0;height:2px;z-index:999;background:linear-gradient(90deg,var(--A),var(--B),var(--C));width:0%;transition:width 60ms linear;box-shadow:0 0 8px rgba(139,92,246,0.6);}

/* ── SHELL ── */
.shell{position:relative;z-index:2;display:grid;grid-template-areas:"hdr hdr""side main";grid-template-columns:288px 1fr;grid-template-rows:auto 1fr;min-height:100vh;max-width:1260px;margin:0 auto;}

/* ── HEADER ── */
.hdr{
  grid-area:hdr;
  display:flex;align-items:center;gap:16px;
  padding:0 22px;height:56px;
  border-bottom:1px solid var(--bd);
  background:color-mix(in srgb,var(--s0) 82%,transparent);
  backdrop-filter:blur(24px);
  position:sticky;top:0;z-index:200;
  animation:hdrIn 480ms var(--ease) both;
}
@keyframes hdrIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.bmark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--A),var(--B));
  display:flex;align-items:center;justify-content:center;font-size:15px;
  box-shadow:0 0 0 3px rgba(139,92,246,0.18),0 4px 10px rgba(139,92,246,0.3);
  animation:iconpop 600ms var(--ease) 100ms both;
}
@keyframes iconpop{from{opacity:0;transform:scale(0.4) rotate(-12deg);}to{opacity:1;transform:scale(1) rotate(0);}}
.bname{font-size:14px;font-weight:700;letter-spacing:-0.3px;line-height:1.1;}
.bsub{font-size:9px;color:var(--ink3);font-family:'DM Mono',monospace;letter-spacing:0.3px;}

.hdr-search{flex:1;max-width:320px;}
.sbox{position:relative;}
.sbox input{
  width:100%;height:32px;
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--rsm);
  padding:0 11px 0 30px;font-family:'DM Sans',sans-serif;font-size:13px;
  color:var(--ink);outline:none;
  transition:border-color var(--dur) ease,box-shadow var(--dur) ease,background var(--dur) ease;
}
.sbox input:focus{border-color:var(--bdfocus);background:var(--s0);box-shadow:0 0 0 3px rgba(139,92,246,0.1);}
.sbox input::placeholder{color:var(--ink3);}
.sico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px;pointer-events:none;}

.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,rgba(139,92,246,0.14),rgba(6,182,212,0.14));
  border:1px solid rgba(139,92,246,0.22);color:var(--A);
  font-family:'DM Mono',monospace;font-size:10px;font-weight:500;
  padding:4px 11px;border-radius:20px;
  animation:badgepulse 2.5s ease-in-out infinite;
}
.badge-dot{width:5px;height:5px;background:var(--A);border-radius:50%;animation:dotblink 2s infinite;}
@keyframes badgepulse{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,0.3);}50%{box-shadow:0 0 0 5px rgba(139,92,246,0);}}
@keyframes dotblink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.ibtn{
  width:32px;height:32px;border-radius:var(--rsm);
  background:var(--s1);border:1px solid var(--bd);color:var(--ink2);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;transition:all var(--dur) ease;
}
.ibtn:hover{background:var(--s2);border-color:var(--bdfocus);color:var(--ink);transform:scale(1.06);}
.ibtn:active{transform:scale(0.92);}
.ndot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--rose);border-radius:50%;border:1.5px solid var(--s0);display:none;}
.ndot.on{display:block;animation:dotpop 300ms var(--ease);}
@keyframes dotpop{from{transform:scale(0);}to{transform:scale(1);}}

/* ── SIDEBAR ── */
.side{
  grid-area:side;
  background:var(--s0);border-right:1px solid var(--bd);
  padding:18px 14px;
  display:flex;flex-direction:column;gap:18px;
  position:sticky;top:56px;height:calc(100vh - 56px);
  overflow-y:auto;
  animation:sidein 480ms var(--ease) 80ms both;
  scrollbar-width:thin;scrollbar-color:var(--s2) transparent;
}
@keyframes sidein{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:translateX(0);}}

.slbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink3);margin-bottom:5px;display:block;}

/* mode */
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mtab{
  padding:7px;border-radius:var(--rsm);font-size:12px;font-weight:600;
  border:1px solid var(--bd);background:transparent;color:var(--ink2);cursor:pointer;
  transition:all var(--dur) ease;text-align:center;
}
.mtab:hover{background:var(--s1);color:var(--ink);}
.mtab.on{
  background:linear-gradient(135deg,var(--A),color-mix(in srgb,var(--A) 55%,var(--B)));
  border-color:transparent;color:#fff;
  box-shadow:0 4px 12px rgba(139,92,246,0.4);
}

/* composer */
.composer{
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;position:relative;
  transition:border-color var(--dur) ease,box-shadow var(--dur) ease;
}
.composer:focus-within{border-color:var(--bdfocus);box-shadow:var(--glow);}
.composer-line{
  position:absolute;bottom:0;left:50%;right:50%;height:2px;
  background:linear-gradient(90deg,var(--A),var(--B));
  transition:left 420ms var(--ease),right 420ms var(--ease);
  border-radius:0 0 var(--r) var(--r);
}
.composer:focus-within .composer-line{left:0;right:0;}

.cauthor{
  width:100%;border:none;border-bottom:1px solid var(--bd);
  background:transparent;padding:10px 14px;
  font-family:'DM Mono',monospace;font-size:11px;color:var(--ink2);outline:none;
  transition:color var(--dur) ease;
}
.cauthor:focus{color:var(--ink);}
.cauthor::placeholder{color:var(--ink3);}

.cbody{
  min-height:100px;padding:12px 14px;
  font-size:14px;line-height:1.65;color:var(--ink);
  outline:none;word-break:break-word;
}
.cbody:empty::before{content:attr(data-ph);color:var(--ink3);pointer-events:none;}
.cbody:focus:empty::before{display:none;}
.cbody:focus:empty::after{content:'|';color:var(--A);animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

.clarea{display:none;padding:8px 14px 10px;flex-direction:column;gap:6px;border-top:1px solid var(--bd);}
.clarea.on{display:flex;}
.clrow{display:flex;align-items:center;gap:7px;}
.clrow input{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-size:13px;color:var(--ink);outline:none;transition:border-color var(--dur) ease;font-family:'DM Sans',sans-serif;}
.clrow input:focus{border-color:var(--bdfocus);}
.clrow input::placeholder{color:var(--ink3);}
.rmbtn{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:13px;padding:4px;border-radius:5px;transition:color var(--dur) ease,background var(--dur) ease;}
.rmbtn:hover{color:var(--rose);background:rgba(244,63,94,0.1);}
.addbtn{background:none;border:1px dashed var(--bd);border-radius:var(--rxs);padding:6px;font-size:11px;color:var(--ink3);cursor:pointer;width:100%;text-align:center;font-family:'DM Mono',monospace;transition:all var(--dur) ease;}
.addbtn:hover{border-color:var(--A);color:var(--A);}

.rgroup{padding:11px 14px;border-top:1px solid var(--bd);}
.swrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform 180ms var(--ease),box-shadow 180ms ease;}
.sw:hover{transform:scale(1.25);}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--A);transform:scale(1.15);}
.catrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.cchip{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:500;border:1px solid var(--bd);background:transparent;color:var(--ink2);cursor:pointer;font-family:'DM Mono',monospace;transition:all 150ms ease;}
.cchip:hover{border-color:var(--bdfocus);color:var(--ink);}
.cchip.on{background:linear-gradient(135deg,var(--A),var(--B));border-color:transparent;color:#fff;}

.cfoot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--bd);background:var(--s0);}
.cchars{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);}
.postbtn{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--A),color-mix(in srgb,var(--A) 55%,var(--B)));
  color:#fff;border:none;border-radius:var(--rsm);
  padding:8px 18px;font-size:13px;font-weight:700;
  cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 4px 14px rgba(139,92,246,0.4);
  transition:transform 120ms ease,box-shadow var(--dur) ease;
}
.postbtn:hover:not(:disabled){box-shadow:0 6px 22px rgba(139,92,246,0.6);transform:translateY(-1px);}
.postbtn:active:not(:disabled){transform:scale(0.95);}
.postbtn:disabled{opacity:0.45;cursor:default;}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp 600ms linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.chk{animation:chkpop 350ms var(--ease) both;}
@keyframes chkpop{from{opacity:0;transform:scale(0.3);}to{opacity:1;transform:scale(1);}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,0.28);transform:scale(0);animation:ripa 500ms ease-out;pointer-events:none;}
@keyframes ripa{to{transform:scale(3);opacity:0;}}

/* ── MAIN ── */
.main{grid-area:main;display:flex;flex-direction:column;animation:fadein 480ms var(--ease) 120ms both;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}

/* filter bar */
.fbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 20px;border-bottom:1px solid var(--bd);
  background:color-mix(in srgb,var(--s0) 75%,transparent);
  backdrop-filter:blur(20px);
  position:sticky;top:56px;z-index:100;
}
.flbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink3);margin-right:4px;}
.fpill{
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;
  border:1px solid var(--bd);background:transparent;color:var(--ink2);cursor:pointer;
  font-family:'DM Mono',monospace;transition:all 150ms ease;
}
.fpill:hover{border-color:var(--bdfocus);color:var(--ink);}
.fpill.on{background:linear-gradient(135deg,var(--A),var(--B));border-color:transparent;color:#fff;box-shadow:0 2px 10px rgba(139,92,246,0.3);}

/* notes area */
.notes-wrap{padding:20px;flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--s2) transparent;}
.grid{columns:2;column-gap:14px;}
@media(max-width:960px){.grid{columns:1;}}

/* ── CARD ── */
.card{
  break-inside:avoid;
  background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);
  margin-bottom:14px;position:relative;overflow:hidden;
  box-shadow:var(--sh);
  animation:cardin 380ms var(--ease) both;
  transition:border-color var(--dur) ease,box-shadow var(--dur) ease,transform var(--dur) var(--ease),filter var(--dur) ease;
}
/* top accent */
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,transparent);border-radius:var(--r) var(--r) 0 0;}
/* gradient wash */
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--card-accent,transparent) 6%,transparent),transparent 55%);pointer-events:none;border-radius:inherit;}
.card:hover{border-color:color-mix(in srgb,var(--A) 40%,var(--bd));box-shadow:var(--shmd);transform:translateY(-3px) scale(1.005);filter:brightness(1.03);}
.card.pinned{border-color:rgba(139,92,246,0.25);}
.card.removing{animation:cardout 240ms ease forwards;}
@keyframes cardin{from{opacity:0;transform:translateY(14px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes cardout{to{opacity:0;transform:scale(0.93) translateY(-8px);}}

/* card header */
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 0;gap:8px;}
.card-who{display:flex;align-items:center;gap:8px;min-width:0;}
.av{
  width:28px;height:28px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--A),var(--B));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
  box-shadow:0 2px 8px rgba(139,92,246,0.3);
}
.cname{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ctime{font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);flex-shrink:0;}

/* badges */
.cbadges{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px 14px 0;}
.pin-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;font-family:'DM Mono',monospace;background:rgba(139,92,246,0.1);color:var(--A);border:1px solid rgba(139,92,246,0.18);}
.pin-tag.bounce{animation:pinbounce 380ms var(--ease);}
@keyframes pinbounce{0%{transform:scale(1);}40%{transform:scale(1.35) rotate(-8deg);}70%{transform:scale(0.9) rotate(4deg);}100%{transform:scale(1);}}
.cat-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;font-family:'DM Mono',monospace;}

/* card body */
.card-body{padding:10px 14px 14px;font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
[data-theme="light"] .card-body{color:#16162A;}

/* edit */
.cedit{width:100%;min-height:72px;background:var(--s1);border:1px solid var(--bdfocus);border-radius:var(--rxs);padding:8px 10px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6;resize:vertical;outline:none;box-shadow:0 0 0 3px rgba(139,92,246,0.08);margin:0 14px 10px;width:calc(100% - 28px);}

/* checklist */
.clprog{height:2px;background:var(--s2);border-radius:2px;margin:0 14px 10px;overflow:hidden;}
.clpbar{height:100%;background:linear-gradient(90deg,var(--A),var(--B));border-radius:2px;transition:width 400ms var(--ease);}
.cllist{padding:0 14px 12px;display:flex;flex-direction:column;gap:5px;}
.clitem{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:8px;cursor:pointer;transition:background 140ms ease;}
.clitem:hover{background:var(--s1);}
.clitem.done{opacity:0.48;}
.clitem.done .cllbl{text-decoration:line-through;}
.clbox{width:17px;height:17px;border-radius:4px;flex-shrink:0;border:2px solid var(--bdfocus);display:flex;align-items:center;justify-content:center;transition:all 180ms var(--ease);background:transparent;}
.clitem.done .clbox{background:linear-gradient(135deg,var(--A),var(--B));border-color:transparent;}
.clchk{font-size:9px;font-weight:900;color:#fff;opacity:0;transition:opacity 140ms ease;}
.clitem.done .clchk{opacity:1;}
.cllbl{font-size:13px;color:var(--ink);}
[data-theme="light"] .cllbl{color:#16162A;}

/* card actions */
.cacts{
  display:flex;align-items:center;justify-content:flex-end;gap:1px;
  padding:8px 10px;border-top:1px solid var(--bd);
  background:color-mix(in srgb,var(--s1) 60%,transparent);
}
.abtn{
  display:inline-flex;align-items:center;gap:3px;
  padding:4px 8px;border-radius:6px;
  background:none;border:none;
  font-size:11px;font-weight:500;color:var(--ink3);cursor:pointer;
  font-family:'DM Mono',monospace;position:relative;overflow:hidden;
  transition:all 140ms ease;
}
.abtn:hover{background:var(--s2);color:var(--ink2);}
.abtn:active{transform:scale(0.92);}
.abtn.pinon{color:var(--A);}
.abtn.danger:hover{background:rgba(244,63,94,0.1);color:var(--rose);}

/* ── EMPTY ── */
.empty{text-align:center;padding:80px 20px;animation:fadein 400ms ease both;}
.eico{font-size:42px;display:block;margin-bottom:16px;animation:floatI 3s ease-in-out infinite;}
@keyframes floatI{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.etitle{font-size:17px;font-weight:700;margin-bottom:6px;}
.esub{font-size:13px;color:var(--ink3);}

/* ── SKELETON ── */
.skel{background:var(--s0);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;break-inside:avoid;position:relative;overflow:hidden;}
.skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 4%,transparent),transparent);animation:shim 1.4s ease-in-out infinite;}
@keyframes shim{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.sk{height:9px;background:var(--s2);border-radius:4px;margin-bottom:8px;}
.sk.w30{width:30%;}.sk.w55{width:55%;}.sk.w80{width:80%;}.sk.w45{width:45%;}

/* ── TOAST ── */
.tshelf{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;align-items:center;z-index:9999;pointer-events:none;}
.toast{display:flex;align-items:center;gap:7px;background:var(--s0);border:1px solid var(--bd);color:var(--ink);font-size:12px;font-weight:500;font-family:'DM Mono',monospace;padding:9px 18px;border-radius:20px;box-shadow:var(--shlg);backdrop-filter:blur(20px);animation:tIn 270ms var(--ease) both;}
.toast.err{background:rgba(244,63,94,0.14);border-color:rgba(244,63,94,0.28);color:var(--rose);}
.toast.out{animation:tOut 210ms ease forwards;}
@keyframes tIn{from{opacity:0;transform:translateY(10px) scale(0.95);}to{opacity:1;transform:none;}}
@keyframes tOut{to{opacity:0;transform:translateY(7px) scale(0.95);}}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(14px);transition:opacity 430ms var(--ease),transform 430ms var(--ease);}
.reveal.in{opacity:1;transform:none;}

.credit{padding:16px 20px;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink3);text-align:center;border-top:1px solid var(--bd);}

/* mobile */
@media(max-width:680px){
  .shell{grid-template-areas:"hdr""side""main";grid-template-columns:1fr;}
  .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--bd);}
  .hdr-search{display:none;}
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s2);border-radius:99px;}
</style>
</head>
<body>
<canvas id="cvs"></canvas>
<div class="orbs"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="cglow" id="cg"></div>
<div class="spbar" id="spbar"></div>

<div class="shell">
  <header class="hdr">
    <div class="brand">
      <div class="bmark">📝</div>
      <div><div class="bname">Office Notepad</div><div class="bsub">Wheels Inc. · Shared Board</div></div>
    </div>
    <div class="hdr-search">
      <div class="sbox"><span class="sico">⌕</span><input type="text" id="searchInput" placeholder="Search notes..."></div>
    </div>
    <div class="hdr-right">
      <div class="badge"><span class="badge-dot"></span><span id="countBadge">0 notes</span></div>
      <button class="ibtn" id="notifBtn" title="Notifications">🔔<span class="ndot" id="notifDot"></span></button>
      <button class="ibtn" id="themeBtn"><span class="si">☀</span><span class="mi" style="display:none">☾</span></button>
    </div>
  </header>

  <aside class="side">
    <div>
      <span class="slbl">Type</span>
      <div class="mrow">
        <button class="mtab on" id="modeNote" onclick="setMode('note')">📝 Note</button>
        <button class="mtab" id="modeCheck" onclick="setMode('checklist')">✅ Checklist</button>
      </div>
    </div>
    <div>
      <span class="slbl">New note</span>
      <div class="composer">
        <div class="composer-line"></div>
        <input class="cauthor" type="text" id="authorInput" placeholder="Your name (optional)" maxlength="40">
        <div class="cbody" id="noteBody" contenteditable="true" data-ph="Write your note here..."></div>
        <div class="clarea" id="clArea">
          <div id="clContainer"></div>
          <button class="addbtn" id="addClBtn">+ Add item</button>
        </div>
        <div class="rgroup">
          <span class="slbl">Color</span>
          <div class="swrow" id="colorPicker"></div>
          <span class="slbl" style="margin-top:11px;display:block">Category</span>
          <div class="catrow" id="catRow"></div>
        </div>
        <div class="cfoot">
          <span class="cchars" id="charCount">0 chars</span>
          <button class="postbtn" id="saveBtn"><span id="saveLabel">✦ Post Note</span></button>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="fbar">
      <span class="flbl">Filter</span>
      <button class="fpill on" data-filter="all">All</button>
      <button class="fpill" data-filter="note">📝 Notes</button>
      <button class="fpill" data-filter="checklist">✅ Checklists</button>
    </div>
    <div class="notes-wrap">
      <div class="grid" id="notesList">
        <div class="skel"><div class="sk w30"></div><div class="sk w80" style="margin-top:10px"></div><div class="sk w55"></div><div class="sk w45"></div></div>
        <div class="skel"><div class="sk w30"></div><div class="sk w80" style="margin-top:10px"></div><div class="sk w55"></div></div>
        <div class="skel"><div class="sk w30"></div><div class="sk w80" style="margin-top:10px"></div><div class="sk w55"></div><div class="sk w45"></div><div class="sk w80"></div></div>
      </div>
      <p class="credit">Copyright © 2026 Jerom Requillo. Released under the MIT License.</p>
    </div>
  </main>
</div>

<div class="tshelf" id="toastWrap"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  const firebaseConfig={apiKey:"AIzaSyCRl2LQBqPUc7uCqJp6sSwPSF6o-9dKb9w",authDomain:"birthday-tracker-dff7f.firebaseapp.com",projectId:"birthday-tracker-dff7f",storageBucket:"birthday-tracker-dff7f.firebasestorage.app",messagingSenderId:"796866393410",appId:"1:796866393410:web:c548cf89c5df9cb9ef04db",measurementId:"G-7TPQ3R4JTP"};
  firebase.initializeApp(firebaseConfig);
  const db=firebase.firestore(),notesCol=db.collection('office_notes');

  const COLORS={none:{name:'None',hex:'transparent'},violet:{name:'Violet',hex:'#8B5CF6'},cyan:{name:'Cyan',hex:'#06B6D4'},amber:{name:'Amber',hex:'#F59E0B'},rose:{name:'Rose',hex:'#F43F5E'},green:{name:'Green',hex:'#10B981'},blue:{name:'Blue',hex:'#3B82F6'}};
  const CATS={none:{label:'—',hex:'#71717A'},urgent:{label:'🔴 Urgent',hex:'#F43F5E'},fyi:{label:'🔵 FYI',hex:'#06B6D4'},meeting:{label:'🟡 Meeting',hex:'#F59E0B'},sales:{label:'🟢 Sales',hex:'#10B981'},parts:{label:'🟣 Parts',hex:'#8B5CF6'},other:{label:'⚪ Other',hex:'#71717A'}};

  const $=id=>document.getElementById(id);
  const notesList=$('notesList'),noteBody=$('noteBody'),authorInput=$('authorInput');
  const saveBtn=$('saveBtn'),saveLabel=$('saveLabel'),colorPicker=$('colorPicker');
  const charCount=$('charCount'),searchInput=$('searchInput'),themeBtn=$('themeBtn');
  const toastWrap=$('toastWrap'),countBadge=$('countBadge'),notifBtn=$('notifBtn');
  const notifDot=$('notifDot'),catRow=$('catRow');

  let notes=[],selColor='none',searchTerm='',editingId=null,justPin=null;
  let selCat='none',filterType='all',noteMode='note',notifOn=false;

  // THEME
  let theme='light';
  function applyTheme(t){document.documentElement.setAttribute('data-theme',t);themeBtn.querySelector('.si').style.display=t==='light'?'inline':'none';themeBtn.querySelector('.mi').style.display=t==='dark'?'inline':'none';}
  applyTheme(theme);
  themeBtn.addEventListener('click',e=>{theme=theme==='dark'?'light':'dark';applyTheme(theme);rip(themeBtn,e);});

  // SCROLL PROGRESS
  document.querySelector('.notes-wrap').addEventListener('scroll',function(){$('spbar').style.width=Math.min(this.scrollTop/(this.scrollHeight-this.clientHeight)*100,100)+'%';});

  // CURSOR GLOW
  document.addEventListener('mousemove',e=>{const cg=$('cg');cg.style.left=e.clientX+'px';cg.style.top=e.clientY+'px';});

  // RIPPLE
  function rip(el,e){const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height);const rp=document.createElement('span');rp.className='rip';rp.style.cssText='width:'+s+'px;height:'+s+'px;left:'+((e?e.clientX-r.left:r.width/2)-s/2)+'px;top:'+((e?e.clientY-r.top:r.height/2)-s/2)+'px';el.appendChild(rp);setTimeout(()=>rp.remove(),510);}

  // TOAST
  function toast(msg,isErr){const el=document.createElement('div');el.className='toast'+(isErr?' err':'');el.innerHTML=(isErr?'⚠ ':'✓ ')+msg;toastWrap.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),220);},2500);}

  // PARTICLES
  const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
  let pts=[];
  function rsz(){cvs.width=window.innerWidth;cvs.height=window.innerHeight;}rsz();window.addEventListener('resize',rsz);
  for(let i=0;i<50;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+0.2,dx:(Math.random()-.5)*.28,dy:(Math.random()-.5)*.28,a:Math.random()*.4+.08,c:['#8B5CF6','#06B6D4','#F59E0B'][Math.floor(Math.random()*3)]});
  function animP(){ctx.clearRect(0,0,cvs.width,cvs.height);pts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0)p.x=cvs.width;if(p.x>cvs.width)p.x=0;if(p.y<0)p.y=cvs.height;if(p.y>cvs.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.globalAlpha=p.a;ctx.fill();});for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<90){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle='#8B5CF6';ctx.globalAlpha=(1-d/90)*.07;ctx.lineWidth=.5;ctx.stroke();}}ctx.globalAlpha=1;requestAnimationFrame(animP);}animP();

  // COLORS
  Object.keys(COLORS).forEach((k,i)=>{const sw=document.createElement('div');sw.className='sw'+(k===selColor?' on':'');sw.style.cssText='background:'+(k==='none'?'var(--s2)':COLORS[k].hex)+';animation-delay:'+(i*35)+'ms';sw.title=COLORS[k].name;if(k==='none')sw.innerHTML='<span style="font-size:9px;display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink3)">\u2715</span>';sw.addEventListener('click',e=>{selColor=k;colorPicker.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===sw));rip(sw,e);});colorPicker.appendChild(sw);});

  // CATEGORIES
  Object.keys(CATS).forEach((k,i)=>{const c=document.createElement('button');c.className='cchip'+(k===selCat?' on':'');c.textContent=CATS[k].label;c.style.animationDelay=(i*30)+'ms';c.addEventListener('click',()=>{selCat=k;catRow.querySelectorAll('.cchip').forEach(x=>x.classList.toggle('on',x===c));});catRow.appendChild(c);});

  // MODE
  window.setMode=function(m){noteMode=m;$('modeNote').classList.toggle('on',m==='note');$('modeCheck').classList.toggle('on',m==='checklist');$('clArea').classList.toggle('on',m==='checklist');noteBody.style.display=m==='checklist'?'none':'';if(m==='checklist'&&!$('clContainer').children.length)addClItem();};

  // CHECKLIST BUILDER
  function addClItem(v){const con=$('clContainer');const row=document.createElement('div');row.className='clrow';const inp=document.createElement('input');inp.type='text';inp.placeholder='Item...';if(v)inp.value=v;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addClItem();}});const rm=document.createElement('button');rm.className='rmbtn';rm.textContent='✕';rm.addEventListener('click',()=>row.remove());row.appendChild(inp);row.appendChild(rm);con.appendChild(row);inp.focus();}
  $('addClBtn').addEventListener('click',()=>addClItem());

  // FILTER
  document.querySelectorAll('[data-filter]').forEach(b=>{b.addEventListener('click',()=>{filterType=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render();});});

  // NOTIFICATIONS
  notifBtn.addEventListener('click',async()=>{if(notifOn){notifOn=false;notifBtn.style.opacity='0.5';toast('Notifications off');return;}if('Notification' in window){const p=await Notification.requestPermission();if(p==='granted'){notifOn=true;notifBtn.style.opacity='1';toast('Notifications on!');}else toast('Hindi pinayagan.',true);}else toast('Not supported.',true);});
  function triggerNotif(n){if(!notifOn||document.hasFocus())return;new Notification('Office Notepad',{body:(n.author||'Someone')+': '+(n.text||'').slice(0,60)});notifDot.classList.add('on');setTimeout(()=>notifDot.classList.remove('on'),4000);}

  noteBody.addEventListener('input',()=>{charCount.textContent=(noteBody.innerText||'').length+' chars';});
  searchInput.addEventListener('input',()=>{searchTerm=searchInput.value.trim().toLowerCase();render();});

  // UTILS
  function fmtTime(ts){const now=Date.now(),d=now-ts,m=Math.floor(d/60000),h=Math.floor(d/3600000),dy=Math.floor(d/86400000);if(d<60000)return 'just now';if(m<60)return m+'m ago';if(h<24)return h+'h ago';if(dy<7)return dy+'d ago';try{return new Date(ts).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
  function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  function ini(n){if(!n)return '?';return n.trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}

  // RENDER
  function render(){
    let vis=notes;
    if(searchTerm)vis=vis.filter(n=>(n.text||'').toLowerCase().includes(searchTerm)||(n.author||'').toLowerCase().includes(searchTerm));
    if(filterType==='note')vis=vis.filter(n=>n.type!=='checklist');
    if(filterType==='checklist')vis=vis.filter(n=>n.type==='checklist');
    const c=vis.length;
    countBadge.textContent=c+(c===1?' note':' notes');
    if(!c){notesList.innerHTML='<div class="empty"><span class="eico">'+(searchTerm?'🔍':'📋')+'</span><p class="etitle">'+(searchTerm?'Walang nahanap':'Wala pang note')+'</p><p class="esub">'+(searchTerm?'Subukan ang ibang salita.':'Ikaw ang unang mag-post!')+'</p></div>';return;}
    const sorted=[...vis].sort((a,b)=>{if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;return b.ts-a.ts;});
    notesList.innerHTML=sorted.map((n,idx)=>{
      const author=(n.author&&n.author.trim())?esc(n.author.trim()):'Anonymous';
      const accent=(COLORS[n.color]||COLORS.none).hex;
      const isEd=editingId===n.id;
      const cat=CATS[n.category]||null;
      const badges=[n.pinned?'<span class="pin-tag'+(justPin===n.id?' bounce':'')+'">📌 pinned</span>':'',(cat&&n.category&&n.category!=='none')?'<span class="cat-tag" style="background:'+cat.hex+'18;color:'+cat.hex+';border:1px solid '+cat.hex+'28">'+cat.label+'</span>':''].filter(Boolean).join('');
      let body='';
      if(n.type==='checklist'&&n.items&&n.items.length){const done=n.items.filter(it=>it.done).length,pct=Math.round(done/n.items.length*100);body='<div class="clprog"><div class="clpbar" style="width:'+pct+'%"></div></div><div class="cllist">'+n.items.map((it,ii)=>'<div class="clitem'+(it.done?' done':'')+'" data-toggle="'+n.id+'" data-idx="'+ii+'"><div class="clbox"><span class="clchk">\u2713</span></div><span class="cllbl">'+esc(it.text)+'</span></div>').join('')+'</div>';}
      else{body='<div class="card-body">'+esc(n.text)+'</div>';}
      const acts=isEd?'<div class="cacts"><button class="abtn" data-cancel="'+n.id+'">\u2715 cancel</button><button class="abtn" data-saveedit="'+n.id+'">\u2713 update</button></div>':'<div class="cacts"><button class="abtn'+(n.pinned?' pinon':'')+'" data-pin="'+n.id+'">📌 '+(n.pinned?'unpin':'pin')+'</button><button class="abtn" data-copy="'+n.id+'">⎘ copy</button><button class="abtn" data-edit="'+n.id+'">✎ edit</button><button class="abtn danger" data-del="'+n.id+'">🗑 delete</button></div>';
      const editBox=isEd?'<textarea class="cedit" id="ed-'+n.id+'">'+esc(n.text)+'</textarea>':'';
      return '<div class="card reveal'+(n.pinned?' pinned':'')+'" data-id="'+n.id+'" style="--card-accent:'+accent+';animation-delay:'+(idx*42)+'ms">'+
        '<div class="card-hdr"><div class="card-who"><div class="av">'+ini(n.author||'Anonymous')+'</div><span class="cname">'+author+'</span></div><span class="ctime">'+fmtTime(n.ts)+'</span></div>'+
        (badges?'<div class="cbadges">'+badges+'</div>':'')+
        (isEd?editBox:body)+acts+
      '</div>';
    }).join('');
    justPin=null;
    notesList.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>delNote(b.dataset.del)));
    notesList.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click',()=>pinNote(b.dataset.pin)));
    notesList.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>cpyNote(b.dataset.copy)));
    notesList.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{editingId=b.dataset.edit;render();}));
    notesList.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>{editingId=null;render();}));
    notesList.querySelectorAll('[data-saveedit]').forEach(b=>b.addEventListener('click',()=>saveEdit(b.dataset.saveedit)));
    notesList.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>toggleCl(el.dataset.toggle,parseInt(el.dataset.idx))));
    // scroll reveal
    notesList.querySelectorAll('.reveal:not(.in)').forEach((el,i)=>setTimeout(()=>el.classList.add('in'),i*45));
    // 3D tilt
    notesList.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform='translateY(-3px) scale(1.005) rotateX('+(-y*4)+'deg) rotateY('+(x*4)+'deg)';});
      card.addEventListener('mouseout',e=>{if(!card.contains(e.relatedTarget))card.style.transform='';});
    });
  }

  // FIRESTORE
  notesCol.onSnapshot(snap=>{
    const prev=notes.slice();
    notes=snap.docs.map(doc=>{const d=doc.data();return{id:doc.id,author:d.author||'',text:d.text||'',ts:d.ts||0,color:d.color||'none',pinned:!!d.pinned,category:d.category||'none',type:d.type||'note',items:d.items||[]};});
    if(prev.length>0&&notes.length>prev.length){const nw=notes.find(n=>!prev.find(p=>p.id===n.id));if(nw)triggerNotif(nw);}
    render();
  },()=>toast('Hindi ma-konekta sa Firebase.',true));

  // SAVE
  async function saveNote(e){
    const text=(noteBody.innerText||'').trim();
    if(noteMode==='note'&&!text){noteBody.focus();return;}
    if(e)rip(saveBtn,e);
    saveBtn.disabled=true;saveLabel.innerHTML='<span class="spin"></span>';
    try{
      let items=[],saveText=text;
      if(noteMode==='checklist'){const inputs=document.querySelectorAll('#clContainer input[type=text]');items=Array.from(inputs).map(i=>({text:i.value.trim(),done:false})).filter(i=>i.text);if(!items.length){toast('Magdagdag ng kahit isang item.',true);saveBtn.disabled=false;saveLabel.textContent='✦ Post Note';return;}saveText=items.map(i=>'- '+i.text).join('\n');}
      await notesCol.add({author:authorInput.value.trim(),text:saveText,html:'',ts:Date.now(),color:selColor,pinned:false,category:selCat,type:noteMode,items});
      if(noteMode==='checklist'){$('clContainer').innerHTML='';addClItem();}
      noteBody.innerHTML='';charCount.textContent='0 chars';
      saveLabel.innerHTML='<span class="chk">\u2713</span> posted!';
      toast('Note posted!');setTimeout(()=>{saveLabel.textContent='✦ Post Note';},1200);
    }catch(err){saveLabel.textContent='✦ Post Note';toast('Hindi na-save.',true);}
    saveBtn.disabled=false;
  }
  async function toggleCl(id,idx){const n=notes.find(x=>x.id===id);if(!n||!n.items)return;const items=n.items.map((it,i)=>i===idx?{...it,done:!it.done}:it);try{await notesCol.doc(id).update({items});}catch(e){toast('Hindi na-update.',true);}}
  async function delNote(id){const card=notesList.querySelector('.card[data-id="'+id+'"]');if(card)card.classList.add('removing');setTimeout(async()=>{try{await notesCol.doc(id).delete();}catch(e){toast('Hindi na-delete.',true);}},240);}
  async function pinNote(id){const n=notes.find(x=>x.id===id);if(!n)return;justPin=!n.pinned?id:null;try{await notesCol.doc(id).update({pinned:!n.pinned});}catch(e){toast('Hindi na-update.',true);}}
  async function cpyNote(id){const n=notes.find(x=>x.id===id);if(!n)return;try{await navigator.clipboard.writeText(n.text);toast('Nakopya!');}catch(e){toast('Hindi nakopya.',true);}}
  async function saveEdit(id){const area=document.getElementById('ed-'+id);if(!area)return;const t=area.value.trim();if(!t)return;try{await notesCol.doc(id).update({text:t,html:''});editingId=null;toast('Na-update!');}catch(e){toast('Hindi na-update.',true);}}

  saveBtn.addEventListener('click',e=>saveNote(e));
  noteBody.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))saveNote();});
  // magnetic button
  saveBtn.addEventListener('mousemove',e=>{const r=saveBtn.getBoundingClientRect();saveBtn.style.transform='translate('+((e.clientX-r.left-r.width/2)*.2)+'px,'+((e.clientY-r.top-r.height/2)*.2)+'px)';});
  saveBtn.addEventListener('mouseleave',()=>{saveBtn.style.transform='';});
  // rotating placeholder
  const phs=['Write your note here...','Anong balita sa office?','May meeting ba?','Anong update?'];let phi=0;
  setInterval(()=>{if(document.activeElement!==noteBody&&!noteBody.innerText.trim()){phi=(phi+1)%phs.length;noteBody.setAttribute('data-ph',phs[phi]);}},3200);
})();
</script>
</body>
</html>
